name: nomad-qa

# After every successful Vercel deploy, Nomad Loop Engine explores the live site like a user.
# Its report feeds both dashboards; a confirmed major or critical bug fails this check.
# Scans the public production URL: per-deploy preview URLs sit behind Vercel's login wall.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL to scan
        required: true

permissions:
  contents: write

concurrency:
  group: nomad-qa
  cancel-in-progress: true

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_URL: ${{ github.event.inputs.url || vars.VAYU_URL || 'https://vayu-pramaan.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start timer
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Nomad Loop Engine scan
        id: nomad
        uses: lakshaysharmaug22-crypto/nomad-loop-engine@main
        continue-on-error: true
        with:
          url: ${{ env.TARGET_URL }}
          steps: '45'
          fail-on: ''

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write report for both dashboards
        id: report
        continue-on-error: true
        run: python scripts/nomad_report.py "${{ steps.nomad.outputs.run-dir }}" "$TARGET_URL" "$GITHUB_SHA" "$(( $(date +%s) - T0 ))"

      - name: Publish report
        if: steps.report.outcome == 'success'
        run: |
          git config user.name "nomad-loop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nomad-report.json site/data/nomad.json
          git diff --cached --quiet || git commit -m "nomad: QA report [skip ci]"
          git pull --rebase --autostash -q && git push

      - name: Gate the release
        if: steps.report.outcome == 'failure' || steps.nomad.outcome == 'failure'
        run: |
          echo "Nomad found a confirmed major or critical bug, or the scan failed. See the nomad-scan artifact."
          exit 1
